name: CI - Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: 'backend/SokoHub.slnx'

jobs:
  build-and-test:
    name: Build and test .NET backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION }}" --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test "${{ env.SOLUTION }}" --configuration Release --no-build --no-restore --nologo --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-results-${{ github.run_number }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish API artifact
        run: dotnet publish backend/src/SokoHub.Api/SokoHub.Api.csproj --configuration Release --no-restore --output ./artifacts/api --nologo

      - name: Upload API artifact
        uses: actions/upload-artifact@v6
        with:
          name: sokohub-api-${{ github.sha }}
          path: artifacts/api
          if-no-files-found: error
          retention-days: 14
